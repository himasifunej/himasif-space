name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: space
          POSTGRES_PASSWORD: space
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U space"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # gofmt + go vet for linux, windows and wasm targets.
      - run: make fmt vet

      # With SPACE_TEST_DATABASE_URL set, the database tests run instead of skipping.
      - name: go test (with Postgres)
        env:
          SPACE_TEST_DATABASE_URL: postgres://space:space@localhost:5432/postgres?sslmode=disable
        run: go test -count=1 ./...
