ary')}</div></section><section class="settings-card"><h2>Akses & periode</h2><div class="settings-row"><div>Ahimsa Jenar<small>Kadiv Mediatek · ${state.period}</small></div>${pill('Kadiv','sand')}</div><div class="settings-row"><div>Pengganti operasional<small>Role 45 belum diberikan.</small></div>${btn('Kelola anggota','members','secondary')}</div></section></div>`;}

 if(state.variant==='B')return `<div class="shell variant-b">${rail()}<div class="work-area">${orbitHeader()}${orbitTabs()}<main class="secondary-page">${content}</main></div></div>`;
 if(state.variant==='E'){const outer=variantE().split('<main class="rhythm-main">')[0];return `${outer}<main class="secondary-page">${content}</main></div></div>`;}

function render(){document.title=`${state.variant} · ${variants[state.variant].name} — Space`;document.documentElement.dataset.variant=state.variant;document.getElementById('app').innerHTML=(state.page==='overview'?({A:variantA,B:variantB,C:variantC,D:variantD,E:variantE}[state.variant])():secondary())+`<footer class="prototype-banner"><span><strong>SPACE</strong> — Ruang Kerja HIMASIF</span><span>Eksplorasi ${state.variant} · Data contoh · Perubahan hanya selama preview</span></footer>`;document.querySelectorAll('.sync').forEach(el=>{el.classList.toggle('offline',state.offline);el.innerHTML=icon(state.offline?'clock':'check')+(state.offline?'Tersimpan di perangkat':'Semua tersinkron');});document.querySelectorAll('.master-bottom').forEach(el=>{el.innerHTML='<span class="live-dot"></span>'+(state.offline?'Tersimpan di perangkat — belum cloud':'Semua perubahan tersinkron');});if(state.offline){const banner=document.createElement('div');banner.className='offline-banner';banner.setAttribute('role','status');banner.textContent='Tidak ada koneksi · Tersimpan di perangkat — belum tersinkron ke cloud';document.querySelector('.work-area').prepend(banner);}renderSwitcher();window.__SPACE_PROTOTYPE_STATE__={...state,tasks:allTasks()};console.info('[Space prototype]',window.__SPACE_PROTOTYPE_STATE__);}
function renderSwitcher(){const v=variants[state.variant];document.getElementById('prototype-switcher').innerHTML=`<div class="prototype-bar" role="navigation" aria-label="Pilih alternatif UI"><button class="icon-button prev" data-cycle="-1" aria-label="Alternatif sebelumnya">${icon('chevron')}</button><span class="prototype-caption"><b>${state.variant} — ${v.name}</b><small>${v.focus}</small></span><div class="variant-buttons">${Object.keys(variants).map(k=>`<button class="variant-button ${state.variant===k?'active':''}" data-variant="${k}" title="${k} — ${variants[k].desc}" aria-label="Alternatif ${k}: ${variants[k].name}" aria-current="${state.variant===k?'page':'false'}">${k}</button>`).join('')}</div><button class="icon-button" data-cycle="1" aria-label="Alternatif berikutnya">${icon('chevron')}</button><span class="prototype-state"><span>DESKTOP · MYGO</span><span>DATA CONTOH · ${state.page.toUpperCase()}</span></span></div>`;}
function chooseVariant(key){state.variant=key;state.page='overview';state.filter='Semua';state.search='';const url=new URL(location.href);url.searchParams.set('variant',key);history.replaceState(null,'',url);closeOverlay();render();window.scrollTo(0,0);}
function cycle(n){const keys=Object.keys(variants);chooseVariant(keys[(keys.indexOf(state.variant)+n+keys.length)%keys.length]);}
let toastTimer;function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('visible'),3600);}
let lastFocus;function closeOverlay(){document.getElementById('overlay-root').innerHTML='';document.body.style.overflow='';if(lastFocus?.isConnected)lastFocus.focus();}
function modal(title,body,actions=''){lastFocus=document.activeElement;document.getElementById('overlay-root').innerHTML=`<div class="modal-backdrop" data-backdrop="true"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-top"><h2>${title}</h2>${mini('plus','close','Tutup')}</div>${body}${actions?`<div class="modal-actions">${actions}</div>`:''}</section></div>`;document.querySelector('.modal-top .icon-button svg').style.transform='rotate(45deg)';document.body.style.overflow='hidden';setTimeout(()=>document.querySelector('.modal input,.modal textarea,.modal button')?.focus(),20);}
function openTask(id){state.selected=Number(id);lastFocus=document.activeElement;document.getElementById('overlay-root').innerHTML=`<div class="overlay-backdrop" data-backdrop="true"><section class="drawer" role="dialog" aria-modal="true" aria-label="Detail tugas"><div class="drawer-header"><span>DETAIL TUGAS · ${state.space.toUpperCase()}</span>${mini('plus','close','Tutup detail')}</div>${detail()}</section></div>`;document.querySelector('.drawer-header .icon-button svg').style.transform='rotate(45deg)';document.body.style.overflow='hidden';document.querySelector('.drawer-header button').focus();}
function newTask(){modal('Buat tugas',`<label class="form-field">Judul tugas<input id="task-title" placeholder="Apa yang perlu dikerjakan?"></label><label class="form-field">Hasil yang diharapkan<textarea id="task-description" placeholder="Jelaskan hasil yang akan diserahkan…"></textarea></label><div class="form-row"><label class="form-field">Penanggung jawab<select id="task-pj">${Object.entries(people).filter(([k])=>!['NY','RF'].includes(k)).map(([id,p])=>`<option value="${id}">${p.name}</option>`).join('')}</select></label><label class="form-field">Deadline<input type="date" id="task-date" value="2026-10-30"></label></div><label class="form-field">Subdivisi<select id="task-category"><option>Desain</option><option>Tekno</option><option>Video</option></select></label><p class="subtle">Tugas muncul di Space ${state.space} dan jobdesk PJ. Reminder: H-2, H-1, dan hari deadline.</p>`,btn('Batal','close','secondary')+btn('Bagikan tugas','save-task','primary','plus'));}

function showAceMenu(){modal('Ace di perangkatmu',`<div class="ace-message"><div><h3>Teman kecil di ruang kerjamu.</h3><p class="subtle">Pilih bagaimana Ace menemanimu. Notifikasi tetap bekerja dalam semua mode.</p></div>${aceArt()}</div><div class="settings-row"><div>Mengambang<small>Terlihat dan bisa dipindahkan.</small></div>${btn('Pilih','ace-float','secondary')}</div><div class="settings-row"><div>Di tepi layar<small>Mengintip; muncul saat di-hover.</small></div>${btn('Pilih','ace-edge','secondary')}</div><div class="settings-row"><div>Sembunyikan<small>Bisa dimunculkan lagi lewat pengaturan.</small></div>${btn('Pilih','ace-hide','secondary')}</div>`,btn('Tutup','close','secondary'));}
function aceDock(){document.getElementById('ace-dock')?.remove();if(!state.ace||!state.aceMode)return;const el=document.createElement('div');el.id='ace-dock';el.className=state.aceMode==='edge'?'ace-dock edge':'ace-dock';el.innerHTML=`<button class="ace-dock-button" data-action="ace-menu" aria-label="Buka pengaturan Ace">${aceArt()}</button><div class="ace-dock-dialog"><strong>Ada satu kiriman menunggumu.</strong><p>Cocokkan hasil desain Sempro — Nadya.</p><button class="text-button" data-task="5">Lihat tugas ${icon('arrow')}</button></div>`;document.body.append(el);}
function playBell(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC){toast('Audio belum tersedia di perangkat ini.');return;}const ac=new AC();const gain=ac.createGain();gain.gain.setValueAtTime(.12,ac.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.8);gain.connect(ac.destination);[880,1320].forEach((f,i)=>{const osc=ac.createOscillator();osc.type='sine';osc.frequency.value=f;osc.connect(gain);osc.start(ac.currentTime+i*.08);osc.stop(ac.currentTime+.9);});setTimeout(()=>ac.close(),1100);toast('Contoh bel ringan diputar.');}

 'close':closeOverlay,'new-task':newTask,'new-agenda':()=>{modal('Tambah agenda',`<p>Pilih apa yang ingin kamu rencanakan.</p><div class="settings-row"><span>Tugas dan deadline</span>${btn('Buat tugas','new-task','secondary','task')}</div><div class="settings-row"><span>Rapat divisi</span>${btn('Buat rapat','meeting','secondary','calendar')}</div><div class="settings-row"><span>Pengingat untuk diri sendiri</span>${btn('Buat reminder','personal-reminder','secondary','bell')}</div>`);},

 'meeting':()=>{closeOverlay();state.page='meetings';render();window.scrollTo(0,0);},'attendance':()=>modal('Kehadiran rapat',`<p>Penyelenggara mengonfirmasi hadir, izin, atau tidak hadir. Membaca pengingat tidak otomatis berarti hadir.</p>${['AJ','ZM','OA','AR'].map(id=>`<div class="settings-row"><span style="display:flex;gap:8px;align-items:center">${avatar(id,'small')}${people[id].name}</span><select aria-label="Kehadiran ${people[id].name}"><option>Belum dikonfirmasi</option><option>Hadir</option><option>Izin</option><option>Tidak hadir</option></select></div>`).join('')}`,btn('Simpan','save-attendance','primary','check')),'save-attendance':()=>{closeOverlay();toast('Kehadiran disimpan dalam preview.');},
 'personal-reminder':()=>modal('Reminder pribadi',`<label class="form-field">Ingatkan tentang<input placeholder="Contoh: cek referensi desain"></label><div class="form-row"><label class="form-field">Tanggal<input type="date" value="2026-10-27"></label><label class="form-field">Jam<input type="time" value="20:30"></label></div><p class="subtle">${icon('lock')}Privat secara default. Akses bisa dibagikan kapan saja.</p>`,btn('Batal','close','secondary')+btn('Simpan reminder','save-reminder','primary','bell')),'save-reminder':()=>{closeOverlay();state.page='reminders';render();toast('Reminder pribadi dibuat dalam preview.');},
 'share-reminder':()=>{state.page='reminders';closeOverlay();render();},'toggle-share':()=>{state.privateShare=!state.privateShare;render();toast(state.privateShare?'Akses dibagikan kepada orang yang dipilih.':'Reminder kembali privat.');},

 'search':()=>{modal('Cari di Space',`<label class="form-field">Judul tugas, anggota, atau catatan<input id="global-search" placeholder="Cari sesuatu…" autocomplete="off"></label><div class="search-results" id="search-results">${tasks.map(t=>`<button data-task="${t.id}">${icon('task')}${t.title}<span class="grow"></span>${pill(t.category,t.color)}</button>`).join('')}</div>`);},

 'attachment':()=>toast('Tautan konsep/hasil adalah contoh untuk eksplorasi UI ini.'),'options':()=>toast('Coba filter subdivisi, buka tugas, atau pindah halaman untuk menjelajahi layout.'),'filter':()=>{state.filter=state.filter==='Semua'?'Desain':'Semua';render();},'new-space':()=>toast('Space divisi dan keanggotaan dikelola melalui admin organisasi.'),'today':()=>toast('Menampilkan minggu 26 Oktober – 1 November 2026.'),'prev-week':()=>toast('Preview agenda memakai minggu contoh yang sama untuk semua alternatif.'),'next-week':()=>toast('Preview agenda memakai minggu contoh yang sama untuk semua alternatif.'),
};
document.addEventListener('click',e=>{const el=e.target.closest('button,[data-task],[data-action],[data-backdrop]');if(!el)return;if(el.dataset.variant){chooseVariant(el.dataset.variant);return;}if(el.dataset.cycle){cycle(Number(el.dataset.cycle));return;}if(el.dataset.backdrop&&e.target===el){closeOverlay();return;}if(el.dataset.space){state.space=el.dataset.space;state.page=state.space==='Medhum'?'medhum':'overview';state.filter='Semua';closeOverlay();render();window.scrollTo(0,0);return;}if(el.dataset.page){state.page=el.dataset.page;if(state.page==='medhum')state.space='Medhum';closeOverlay();render();window.scrollTo(0,0);return;}if(el.dataset.filter){state.filter=el.dataset.filter;render();return;}if(el.dataset.select){state.selected=Number(el.dataset.select);render();return;}if(el.dataset.task){openTask(el.dataset.task);return;}if(el.dataset.action==='toggle-generic'){el.classList.toggle('on');el.setAttribute('aria-pressed',el.classList.contains('on'));return;}if(el.dataset.action){actions[el.dataset.action]?.();aceDock();}});
document.addEventListener('input',e=>{if(e.target.id==='global-search'){const q=e.target.value.toLowerCase();document.getElementById('search-results').innerHTML=allTasks().filter(t=>(t.title+' '+people[t.pj].name).toLowerCase().includes(q)).map(t=>`<button data-task="${t.id}">${icon('task')}${esc(t.title)}<span class="grow"></span>${pill(t.category,t.color)}</button>`).join('')||'<p class="subtle">Belum ada hasil.</p>';}if(e.target.id==='master-search'){const q=e.target.value.toLowerCase();document.querySelectorAll('.master-item').forEach(el=>el.hidden=!el.textContent.toLowerCase().includes(q));}});
document.addEventListener('keydown',e=>{const editing=e.target.closest('input,textarea,select,[contenteditable="true"]');if(e.key==='Escape'){closeOverlay();return;}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();actions.search();return;}if(!editing&&!document.querySelector('[role="dialog"]')&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();cycle(e.key==='ArrowRight'?1:-1);}if(e.key==='Tab'){const dialog=document.querySelector('[role="dialog"]');if(!dialog)return;const items=[...dialog.querySelectorAll('button,input,select,textarea,[tabindex="0"],a[href]')].filter(x=>!x.disabled&&x.offsetParent!==null);if(!items.length)return;const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
render();
</script></body></html>
